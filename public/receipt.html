<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電子收據</title>
  <script>
    if (
      location.hostname === "main.uniform-pos-app-current.pages.dev"
      && (location.pathname === "/receipt" || location.pathname === "/receipt.html")
    ) {
      location.replace(`https://uniform-pos-app-current.pages.dev${location.pathname}${location.search}${location.hash}`);
    }
  </script>
  <style>
    :root { color: #17212b; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    body { margin: 0; background: #eef1f5; }
    main { max-width: 520px; margin: 24px auto; padding: 0 16px 32px; }
    .receipt { background: #fff; padding: 28px 24px; box-shadow: 0 8px 24px rgba(24, 42, 58, .12); }
    header { text-align: center; border-bottom: 2px solid #1f3a5f; padding-bottom: 18px; }
    .company-logo { display: block; width: 76px; height: 52px; margin: 0 auto 10px; background: #fff; border: 0; }
    h1 { margin: 0; font-size: 21px; letter-spacing: 0; }
    .subtitle { color: #66717d; font-size: 12px; margin-top: 5px; }
    dl { display: grid; grid-template-columns: 92px 1fr; gap: 7px 12px; margin: 20px 0; font-size: 13px; }
    dt { color: #66717d; } dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
    .items { border-top: 1px solid #dbe1e7; border-bottom: 1px solid #dbe1e7; padding: 12px 0; }
    .item { padding: 8px 0; }
    .item-main, .item-sub, .total { display: flex; justify-content: space-between; gap: 12px; }
    .item-main { font-weight: 600; font-size: 14px; }
    .item-sub { color: #66717d; font-size: 12px; margin-top: 3px; }
    .item-sub span:first-child { color: #999; min-width: 40px; }
    .summary { padding-top: 16px; font-size: 14px; }
    .total { font-size: 19px; font-weight: 700; color: #1f3a5f; margin-top: 10px; }
    footer { text-align: center; color: #66717d; font-size: 12px; line-height: 1.6; margin-top: 24px; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    button { flex: 1; border: 0; border-radius: 7px; padding: 12px; background: #1f3a5f; color: #fff; font-size: 14px; cursor: pointer; }
    .secondary { background: #fff; color: #1f3a5f; border: 1px solid #1f3a5f; }
    .language-control { margin-top: 0; }
    .translation-note { display: block; color: #8a5a00; font-size: 11px; font-weight: 400; margin-top: 3px; }
    .policy { margin-top: 16px; color: #66717d; font-size: 11px; line-height: 1.6; }
    .error { text-align: center; background: #fff; padding: 32px 20px; color: #b42318; }
    @media print {
      body { background: #fff; }
      main { margin: 0; max-width: none; padding: 0; }
      .receipt { box-shadow: none; padding: 0; }
      .actions { display: none; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.getElementById("app");
    const money = (value) => "$" + Math.round(Number(value) || 0).toLocaleString("en-HK");
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
    const text = (value, fallback = "-") => escapeHtml(value == null || value === "" ? fallback : value);
    const customerSurname = (name) => String(name || "").trim().replace(/\s+/g, "").slice(0, 1);
    const customerPhoneLast4 = (phone) => String(phone || "").replace(/\D/g, "").slice(-4);
    const englishTime = (value) => {
      const match = String(value || "").match(/^(上午|下午)\s*(\d{1,2}):(\d{2})$/);
      if (!match) return value;
      const hour = Number(match[2]);
      const isPm = match[1] === "下午";
      const hour12 = hour % 12 || 12;
      return `${hour12}:${match[3]} ${isPm ? "PM" : "AM"}`;
    };
    const sizeLabel = (item) => item.length ? `${item.size}／${item.length}` : item.size;
    const dimensionLabels = (productName) => {
      const name = String(productName || "").replace(/\s+/g, "");
      if (/裙/.test(name)) return { length: "裙長", size: "上圍" };
      if (/長袖.*(?:恤衫|襯衫)|(?:恤衫|襯衫).*長袖/.test(name)) return { length: "袖長", size: "領圍" };
      if (/(?:西褲|長褲|短褲|運動褲|褲)/.test(name)) return { length: "褲長", size: "腰圍" };
      return { length: "", size: "尺碼" };
    };
    const productUnit = (productName) => {
      const name = String(productName || "").replace(/\s+/g, "");
      if (/襪.*[（(]?\d+對|[（(]3對[）)]/.test(name)) return "包";
      if (/襪|鞋|手套/.test(name)) return "對";
      if (/套裝|套服/.test(name)) return "套";
      if (/皮帶|腰帶|領帶|頸巾|圍巾/.test(name)) return "條";
      if (/書包|背囊|袋|筆袋/.test(name)) return "個";
      return "件";
    };
    const englishProductUnit = (productName) => ({
      "件": "pcs", "對": "pairs", "包": "packs", "套": "sets", "條": "pcs", "個": "pcs",
    }[productUnit(productName)] || "pcs");
    const exactProductTranslations = {
        "男生白色長袖恤衫": "Boys' White Long-sleeve Shirt",
        "男生白色短袖恤衫": "Boys' White Short-sleeve Shirt",
        "女生白色長袖恤衫": "Girls' White Long-sleeve Shirt",
        "女生白色短袖恤衫": "Girls' White Short-sleeve Shirt",
        "深炭灰色半截校裙": "Dark Charcoal Grey Half-length Skirt",
        "男生深炭灰色長西褲": "Boys' Dark Charcoal Grey Long Trousers",
        "男生西裝褸配背心": "Boys' Blazer with Waistcoat",
        "女裝西裝褸配背心": "Girls' Blazer with Waistcoat",
        "深炭灰色西裝褸配厚抓毛背心": "Dark Charcoal Grey Blazer with Fleece Waistcoat",
        "男女生 - 運動衫": "Unisex Sports Shirt",
        "男女生 - 運動套裝": "Unisex Sports Set",
        "男女生 - 冷衫": "Unisex Jumper",
        "男女生 - 混合毛冷衫": "Unisex Wool-blend Jumper",
    };
    const productTranslationTerms = {
      "深炭灰色": "Dark Charcoal Grey", "寶藍色": "Royal Blue", "炭灰色": "Charcoal Grey",
      "粉紅色": "Pink", "咖啡色": "Brown", "紫色": "Purple", "藍色": "Blue",
      "灰色": "Grey", "黑色": "Black", "白色": "White", "啡色": "Brown",
      "杏色": "Beige", "綠色": "Green", "黃色": "Yellow", "紅色": "Red",
      "男女生": "Unisex", "男生": "Boys'", "女生": "Girls'", "男裝": "Men's", "女裝": "Women's",
      "半截校裙": "Half-length School Skirt", "連身校裙": "One-piece School Dress",
      "西裝褸配厚抓毛背心": "Blazer with Fleece Waistcoat", "西裝褸配背心": "Blazer with Waistcoat",
      "男生深炭灰色長西褲": "Boys' Dark Charcoal Grey Long Trousers",
      "長西褲": "Long Trousers", "短西褲": "Short Trousers", "運動短褲": "Sports Shorts",
      "運動長褲": "Sports Trousers", "運動褲": "Sports Trousers", "長褲": "Trousers", "西褲": "Trousers",
      "運動上衣": "Sports Top", "運動外套": "Sports Jacket", "運動套裝": "Sports Set",
      "運動衫": "Sports Shirt", "運動衣": "Sports Top", "運動服": "Sportswear",
      "運動風褸": "Sports Windbreaker", "風褸": "Windbreaker", "校褸": "School Jacket",
      "西裝褸": "Blazer", "抓毛背心": "Fleece Waistcoat", "背心": "Waistcoat",
      "長袖": "Long-sleeve", "短袖": "Short-sleeve", "連身": "One-piece",
      "恤衫": "Shirt", "襯衫": "Shirt", "半截": "Half-length", "校裙": "School Skirt",
      "裙褲": "Skort", "裙": "Skirt", "毛冷衫": "Wool Jumper", "冷衫": "Jumper",
      "衛衣": "Sweatshirt", "外套": "Jacket", "校服": "School Uniform",
      "混合毛": "Wool-blend", "羊毛": "Wool", "棉": "Cotton", "長褸": "Long Coat",
      "短褸": "Short Jacket", "褸": "Coat", "POLO": "Polo", "領帶": "Tie",
      "皮帶": "Belt", "腰帶": "Belt", "校徽": "School Badge", "繡章": "Embroidered Badge",
      "連繡章": "with Embroidered Badge", "底衫": "Undershirt", "底裙": "Underskirt",
      "襪": "Socks", "鞋": "Shoes", "手套": "Gloves", "書包": "School Bag",
      "背囊": "Backpack", "筆袋": "Pencil Case", "格仔": "Checked", "水手領": "Sailor Collar",
      "開胸": "Open-front", "半橡筋": "Half-elastic Waist", "領圍": "Collar",
      "上圍": "Chest", "褲長": "Trouser Length", "裙長": "Skirt Length", "袖長": "Sleeve Length",
      "長度": "Length", "短": "Short", "長": "Long", "裁碼": "Tailored",
    };
    const productTranslationKeys = Object.keys(productTranslationTerms).sort((a, b) => b.length - a.length);
    const translateProductName = (productName) => {
      const name = String(productName || "").trim();
      if (exactProductTranslations[name]) return { text: exactProductTranslations[name], translated: true };

      let result = "";
      for (let index = 0; index < name.length;) {
        if (/\s/.test(name[index])) {
          result += " ";
          index += 1;
          continue;
        }
        const term = productTranslationKeys.find((candidate) => name.startsWith(candidate, index));
        if (term) {
          result += `${result && !/\s$/.test(result) ? " " : ""}${productTranslationTerms[term]}`;
          index += term.length;
          continue;
        }
        const character = name[index];
        if (/[\u3400-\u9fff]/.test(character)) return { text: name, translated: false };
        if (/[（(]/.test(character)) {
          result += " (";
        } else if (/[）)]/.test(character)) {
          result = `${result.trimEnd()})`;
        } else if (/[／/、，,]/.test(character)) {
          result = `${result.trimEnd()} / `;
        } else {
          result += character;
        }
        index += 1;
      }
      return { text: result.replace(/\s+/g, " ").replace(/\s+([,)])/g, "$1").trim() || name, translated: true };
    };
    const exactSchoolTranslations = {
      "港青基信書院": "YMCA of Hong Kong Christian College",
    };
    const translateSchoolName = (school) => {
      const name = String(school || "").trim();
      return exactSchoolTranslations[name]
        ? { text: exactSchoolTranslations[name], translated: true }
        : { text: name, translated: !/[\u3400-\u9fff]/.test(name) };
    };
    const formatSizeDisplay = (productName, size, length, english = false) => {
      const labels = dimensionLabels(productName);
      const translatedLabels = english
        ? { length: labels.length === "裙長" ? "Skirt length" : labels.length === "袖長" ? "Sleeve length" : labels.length === "褲長" ? "Trouser length" : "Length", size: labels.size === "上圍" ? "Chest" : labels.size === "領圍" ? "Collar" : labels.size === "腰圍" ? "Waist" : "Size" }
        : labels;
      if (length && size) {
        return `${translatedLabels.length}: ${text(english ? translateAttribute(length) : length)} (${translatedLabels.size}: ${text(english ? translateAttribute(size) : size)})`;
      } else if (length) {
        return `${translatedLabels.length}: ${text(english ? translateAttribute(length) : length)}`;
      } else {
        return `${translatedLabels.size}: ${text(english ? translateAttribute(size) : size)}`;
      }
    };
    const translateAttribute = (value) => {
      const normalized = String(value || "").trim();
      return productTranslationTerms[normalized] || normalized;
    };
    const sourceReceiptId = (order) => order.exchangeSourceReceiptId || order.exchange_source_receipt_id || order.sourceReceiptId || "";
    let receiptOrder = null;
    let receiptLanguage = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "zh";
    window.setReceiptLanguage = (language) => {
      receiptLanguage = language === "en" ? "en" : "zh";
      const url = new URL(location.href);
      url.searchParams.set("lang", receiptLanguage);
      history.replaceState(null, "", url);
      if (receiptOrder) render(receiptOrder);
    };
    const render = (order) => {
      receiptOrder = order;
      const english = receiptLanguage === "en";
      const labels = english ? {
        school: "School", receiptNo: "Receipt No.", source: "Source Receipt", date: "Date", customer: "Customer", phone: "Last 4 digits",
        items: "Items", quantity: "Qty", itemCount: "Item count", total: "Total due", exchangeTotal: "Exchange difference",
        refund: "Refund due", status: "Status", completed: "Completed", exchanged: "Exchange completed",
        translationUnavailable: "Verified English translation unavailable; original name shown.",
        returnPolicy: "Returns & exchanges: Within 30 days of purchase, present this receipt at the designated store to exchange the size, provided the item is unused, unwashed and unaltered.",
        careTitle: "Care instructions:", care: "Do not use bleach, colour bleach or bleaching products. Separate light and dark garments and hang them to dry promptly after washing.",
        thanks: "Thank you for your purchase. We look forward to serving you again.",
      } : {
        school: "學校", receiptNo: "收據編號", source: "來源單據", date: "交易日期", customer: "客人", phone: "電話尾4位",
        items: "商品明細", quantity: "數量", itemCount: "商品件數", total: "應付總額", exchangeTotal: "換貨差額",
        refund: "應退客人", status: "交易狀態", completed: "已完成", exchanged: "換貨完成",
        translationUnavailable: "",
        returnPolicy: "退換條款：購貨後 30 天內，憑收據且商品未經使用、洗滌或改動，可親臨指定門市辦理更換尺碼。",
        careTitle: "洗滌指引：", care: "請勿使用含有漂白成份之洗衣產品、彩漂或漂白水。深淺色衣物必須分開洗滌，清洗後請即時晾曬，以免移色。",
        thanks: "多謝惠顧，歡迎重臨",
      };
      document.title = (english ? "Electronic Receipt #" : "電子收據 #") + text(order.id).toUpperCase();
      const items = Array.isArray(order.items) ? order.items : [];
      const schoolDisplay = english ? translateSchoolName(order.school) : { text: order.school || "", translated: true };
      document.documentElement.lang = english ? "en" : "zh-Hant";
      app.innerHTML = `
        <section class="receipt">
          <header>
            <h1>${english ? "Victoria Uniform" : "Victoria Uniform 校服銷售"}</h1>
            <div class="subtitle">${english ? "ELECTRONIC RECEIPT" : "電子銷售單 ELECTRONIC RECEIPT"}</div>
          </header>
          <dl>
            <dt>${labels.receiptNo}</dt><dd>#${text(order.id).toUpperCase()}</dd>
            ${sourceReceiptId(order) ? `<dt>${labels.source}</dt><dd>#${text(sourceReceiptId(order)).toUpperCase()}</dd>` : ""}
            <dt>${labels.date}</dt><dd>${text(order.date)} ${text(english ? englishTime(order.time) : order.time, "")}</dd>
            <dt>${labels.school}</dt><dd>${text(schoolDisplay.text)}${english && !schoolDisplay.translated ? `<span class="translation-note">${labels.translationUnavailable}</span>` : ""}</dd>
            <dt>${labels.customer}</dt><dd>${text(customerSurname(order.customerName))}</dd>
            <dt>${labels.phone}</dt><dd>${text(customerPhoneLast4(order.customerPhone))}</dd>
          </dl>
          <div class="items">
              ${items.map((item) => {
                const sign = item.exchangeReturn ? -1 : 1;
                const translatedName = english ? translateProductName(item.name) : { text: item.name, translated: true };
                return `<div class="item"><div class="item-main"><span>${item.exchangeReturn ? (english ? "Exchange out: " : "換出：") : ""}${text(translatedName.text)}${english && !translatedName.translated ? `<span class="translation-note">${labels.translationUnavailable}</span>` : ""}</span><span>${money(sign * Number(item.price) * Number(item.qty))}</span></div><div class="item-sub"><span>${formatSizeDisplay(item.name, item.size, item.length, english)}</span></div><div class="item-sub"><span>${labels.quantity}</span><span>${text(item.qty, "0")} ${english ? englishProductUnit(item.name) : productUnit(item.name)} × ${money(item.price)}</span></div></div>`;
              }).join("")}
          </div>
          <div class="summary">
            <div class="item-sub"><span>${labels.itemCount}</span><span>${text(order.itemCount, "0")}</span></div>
            <div class="total"><span>${sourceReceiptId(order) ? labels.exchangeTotal : labels.total}</span><span>${money(order.total)}</span></div>
            ${order.refundDue > 0 ? `<div class="item-sub" style="margin-top:8px"><span>${labels.refund}</span><span>${money(order.refundDue)}</span></div>` : ""}
            <div class="item-sub" style="margin-top:8px"><span>${labels.status}</span><span>${sourceReceiptId(order) ? labels.exchanged : labels.completed}</span></div>
          </div>
          <div class="policy"><strong>${labels.returnPolicy}</strong><br><strong>${labels.careTitle}</strong><br>${labels.care}</div>
          <footer>${labels.thanks}</footer>
        </section>
        <div class="actions language-control"><button class="secondary" onclick="setReceiptLanguage('${english ? "zh" : "en"}')">${english ? "查看中文版本" : "View in English"}</button></div>
        <div class="actions"><button onclick="window.print()">${english ? "Print / Save as PDF" : "列印／另存為 PDF"}</button><button class="secondary" onclick="window.close()">${english ? "Close" : "關閉"}</button></div>`;
    };
    try {
      const value = new URLSearchParams(location.search).get("data");
      if (!value) throw new Error("missing receipt data");
      const binary = atob(value);
      const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
      const json = new TextDecoder("utf-8").decode(bytes);
      render(JSON.parse(json));
    } catch (error) {
      app.innerHTML = '<div class="error">收據連結無效或已損壞，請向店員索取新的 QR Code。</div>';
    }
  </script>
</body>
</html>
